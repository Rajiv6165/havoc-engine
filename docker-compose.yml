version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: havoc
    ports:
      - "5432:5432"

  havoc-engine:
    build: .
    ports:
      - "9090:9090"
    command: ["serve"]
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/havoc?sslmode=disable"
    depends_on:
      - postgres

  havoc-cron:
    build: .
    command: ["cron", "start"]
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/havoc?sslmode=disable"
    depends_on:
      - postgres

  havoc-dashboard:
    build: 
      context: ./havoc-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_ENGINE_API: "http://havoc-engine:9090"
    depends_on:
      - havoc-engine

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - havoc-engine
