name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  engine-build-and-test:
    name: Build and Test Havoc Engine (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: havoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/havoc?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Go Build
        run: go build -v ./...

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v ./...

  dashboard-build:
    name: Build Havoc Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./havoc-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'havoc-dashboard/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
