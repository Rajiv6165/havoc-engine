name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  engine-build-and-test:
    name: Build and Test Havoc Engine (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Go Build
        run: go build -v ./...

      - name: Go Test
        run: go test -v ./...

  dashboard-build:
    name: Build Havoc Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./havoc-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './havoc-dashboard/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
