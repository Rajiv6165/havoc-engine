kubeconfig: "~/.kube/config"
default_namespace: "default"
maxBlastRadiusPercent: 30
abortOnErrorRatePercent: 5.0
database_dsn: "postgres://postgres:postgres@localhost:5432/havoc?sslmode=disable"
prometheus:
  url: "http://localhost:9092"
scoring:
  recoveryTimeOptimalMs: 5000
  recoveryTimeMaxMs: 30000
  errorRateOptimalPercent: 1.0
  errorRateMaxPercent: 10.0
  safetyInterventionPenalty: 50

scheduler:
  enabled: true
  allowedWindows:
    - days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
      startTime: "10:00"
      endTime: "16:00"
  minExecutions: 1
  maxExecutions: 3
  period: "week"

server:
  host: "127.0.0.1"
  port: 8080
  ws_port: 9091
  metrics_port: 9090
  allowed_cors:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

topology:
  nodes:
    - id: "api-gateway"
      label: "api-gateway"
      podCount: 3
    - id: "payment-service"
      label: "payment-service"
      podCount: 2
    - id: "user-service"
      label: "user-service"
      podCount: 4
    - id: "database-service"
      label: "database-service"
      podCount: 1
    - id: "queue-service"
      label: "queue-service"
      podCount: 2
  edges:
    - source: "api-gateway"
      target: "payment-service"
    - source: "api-gateway"
      target: "user-service"
    - source: "payment-service"
      target: "database-service"
    - source: "payment-service"
      target: "queue-service"
    - source: "user-service"
      target: "queue-service"

